project_name = "wwe2k16"
file_path = "game/default.xex"
out_directory_path = "generated"

# WWE 2K16 retail disc (Xbox 360), no title update.

# The CRT's setjmp / longjmp (jmp_buf in r3). Recompiled as plain code, setjmp returns the jmp_buf address,
# so error paths (libjpeg decodes) misbehave; the codegen replaces calls to them. Found by tools/find_functions.py.
setjmp_address = 0x831EFB10
longjmp_address = 0x831EF7F0

includes = ["config/functions.toml", "config/functions_fptrs.toml", "config/functions_thunks.toml", "config/hooks.toml"]
